<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Yasser Tech Solutions | Scientific Calculator</title>

<style>
:root{
  --bg1:#0f2027;
  --bg2:#203a43;
  --bg3:#2c5364;
  --calc:#ffffff;
  --btn:#f1f1f1;
  --text:#000;
  --display:#000;
}

.dark{
  --bg1:#000428;
  --bg2:#004e92;
  --bg3:#000000;
  --calc:#111;
  --btn:#222;
  --text:#fff;
  --display:#000;
}

*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:"Segoe UI",Arial;
}

/* CALCULATOR */
.calculator{
  width:460px;
  padding:30px;
  border-radius:24px;
  position:fixed;
  background:
    linear-gradient(rgba(255,255,255,0.92), rgba(255,255,255,0.92)),
    url("https://files.catbox.moe/gqx5dp.jpg");
  background-repeat:no-repeat;
  background-position:center;
  background-size:280px;
  animation: rotateBg 40s linear infinite;
  box-shadow:
    0 0 40px rgba(0,255,255,.35),
    0 30px 70px rgba(0,0,0,.6);
}

/* DARK MODE OVERLAY */
.dark .calculator{
  background:
    linear-gradient(rgba(17,17,17,0.94), rgba(17,17,17,0.94)),
    url("https://files.catbox.moe/gqx5dp.jpg");
  background-repeat:no-repeat;
  background-position:center;
  background-size:280px;
}

/* BACKGROUND ROTATION */
@keyframes rotateBg{
  from{background-position:center;transform:rotate(0deg)}
  to{background-position:center;transform:rotate(360deg)}
}

/* BRAND */
.brand{
  text-align:center;
  margin-bottom:15px;
}

.brand h1{
  margin:0;
  font-size:22px;
  letter-spacing:2px;
  color:#00eaff;
  text-shadow:0 0 12px #00eaff;
}

.brand span{
  font-size:12px;
  color:var(--text);
}

/* TOP BAR */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:10px 0 15px;
}

.mode{
  background:linear-gradient(135deg,#ff9500,#ff5e00);
  border:none;
  padding:7px 16px;
  border-radius:20px;
  color:#fff;
  cursor:pointer;
}

/* DISPLAY */
.display{
  width:100%;
  height:85px;
  background:var(--display);
  color:#00ff99;
  font-size:32px;
  padding:15px;
  border:none;
  border-radius:16px;
  text-align:right;
  box-shadow:inset 0 0 18px rgba(0,255,150,.5);
}

/* BUTTONS */
.buttons{
  margin-top:22px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
}

button{
  height:58px;
  border:none;
  border-radius:16px;
  font-size:16px;
  cursor:pointer;
  background:var(--btn);
  color:var(--text);
  box-shadow:0 8px 14px rgba(0,0,0,.35);
}

button:hover{
  transform:scale(1.06);
}

.operator{
  background:linear-gradient(135deg,#ff9500,#ff5e00);
  color:#fff;
}

.equal{
  grid-column:span 2;
  background:linear-gradient(135deg,#00c853,#00e676);
  color:#fff;
}

.clear{
  background:linear-gradient(135deg,#ff3b30,#ff0000);
  color:#fff;
}

/* FOOTER */
.footer{
  margin-top:18px;
  text-align:center;
  font-size:11px;
  color:var(--text);
  opacity:.8;
}
</style>
</head>

<body>

<!-- SOUND EFFECTS -->
<audio id="clickSound" src="https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3"></audio>
<audio id="equalSound" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<div class="calculator">
  <div class="brand">
    <h1>YASSER TECH</h1>
    <span>Solutions • Scientific Calculator</span>
  </div>

  <div class="top-bar">
    <strong>PRO MODE</strong>
    <button class="mode" onclick="toggle()">🌙 / ☀️</button>
  </div>

  <input type="text" id="display" class="display" disabled>

  <div class="buttons">
    <button onclick="press(()=>func('sin'))">sin</button>
    <button onclick="press(()=>func('cos'))">cos</button>
    <button onclick="press(()=>func('tan'))">tan</button>
    <button onclick="press(()=>func('log'))">log</button>
    <button onclick="press(()=>func('ln'))">ln</button>

    <button onclick="press(()=>add('Math.PI'))">π</button>
    <button onclick="press(()=>add('Math.E'))">e</button>
    <button onclick="press(()=>add('**'))">xʸ</button>
    <button onclick="press(()=>sqrt())">√</button>
    <button onclick="press(()=>square())">x²</button>

    <button class="clear" onclick="press(()=>clr())">C</button>
    <button onclick="press(()=>del())">⌫</button>
    <button class="operator" onclick="press(()=>add('/'))">÷</button>
    <button class="operator" onclick="press(()=>add('*'))">×</button>
    <button class="operator" onclick="press(()=>add('-'))">−</button>

    <button onclick="press(()=>add('7'))">7</button>
    <button onclick="press(()=>add('8'))">8</button>
    <button onclick="press(()=>add('9'))">9</button>
    <button class="operator" onclick="press(()=>add('+'))">+</button>

    <button onclick="press(()=>add('4'))">4</button>
    <button onclick="press(()=>add('5'))">5</button>
    <button onclick="press(()=>add('6'))">6</button>

    <button onclick="press(()=>add('1'))">1</button>
    <button onclick="press(()=>add('2'))">2</button>
    <button onclick="press(()=>add('3'))">3</button>

    <button onclick="press(()=>add('0'))">0</button>
    <button onclick="press(()=>add('.'))">.</button>
    <button class="equal" onclick="press(calc,true)">=</button>
  </div>

  <div class="footer">
    © 2026 Yasser Tech Solutions • Power & Precision
  </div>
</div>

<script>
const d=document.getElementById("display");
const clickSound=document.getElementById("clickSound");
const equalSound=document.getElementById("equalSound");

function press(action,isEqual=false){
  (isEqual?equalSound:clickSound).currentTime=0;
  (isEqual?equalSound:clickSound).play();
  action();
}

function add(v){d.value+=v}
function clr(){d.value=""}
function del(){d.value=d.value.slice(0,-1)}
function calc(){try{d.value=eval(d.value)}catch{d.value="Error"}}

function func(f){
  let x=eval(d.value);
  if(f==="sin") d.value=Math.sin(x);
  if(f==="cos") d.value=Math.cos(x);
  if(f==="tan") d.value=Math.tan(x);
  if(f==="log") d.value=Math.log10(x);
  if(f==="ln") d.value=Math.log(x);
}
function sqrt(){d.value=Math.sqrt(eval(d.value))}
function square(){d.value=Math.pow(eval(d.value),2)}
function toggle(){document.body.classList.toggle("dark")}
</script>

</body>
  </html>
